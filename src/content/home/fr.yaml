# Textes de la page d'accueil — version française
# Source : maquette Figma « Mille Solutions - Site Internet REAL » (Accueil — FR), textes validés.
meta:
  title: "Mille Solutions — Structurer. Prioriser. Concrétiser. | Monaco"
  description: "J’accompagne les TPE, PME et institutions à Monaco et dans la région pour clarifier leurs besoins, structurer leurs projets et coordonner leur mise en œuvre."

hero:
  title:
    - "Faire avancer vos projets."
    - "Simplifier votre fonctionnement."
  lead: "J’accompagne les entreprises et les organisations dans la gestion de leurs projets, l’amélioration de leur fonctionnement et la mise en œuvre de solutions concrètes."
  leadSecondary: "J’interviens également sur des besoins opérationnels ponctuels, lorsque vous manquez de temps, de ressources ou simplement d’un regard extérieur pour avancer."
  engagementLabel: "Mon engagement"
  signature: "Structurer. Prioriser. Concrétiser."
  # Photo provisoire issue de la maquette Figma : origine et droits à valider avant publication.
  imageAlt: "Vue de Monaco : la ville, le port Hercule et la mer en lumière du matin."

situations:
  eyebrow: "Vos besoins"
  title: "Vous avez besoin de faire avancer un sujet ?"
  items:
    - icon: coordination
      title: "Un projet qui peine à avancer"
      text: ""
      paragraphs:
        - "Les objectifs manquent de clarté, les décisions tardent ou les intervenants peinent à se coordonner."
        - "Je vous aide à identifier les blocages, organiser les étapes et remettre le projet en mouvement."
    - icon: structuration
      title: "Une organisation qui pourrait fonctionner plus simplement"
      text: ""
      paragraphs:
        - "Processus complexes, outils inadaptés, tâches répétitives ou responsabilités mal définies compliquent votre quotidien."
        - "Je vous accompagne pour identifier les améliorations utiles et les mettre en place."
    - icon: priorisation
      title: "Un besoin ponctuel, mais pas les ressources pour le traiter"
      text: ""
      paragraphs:
        - "Une étude à réaliser, un événement à préparer, une opportunité à explorer ou une action à coordonner ?"
        - "Je peux prendre en charge ces missions, de leur préparation jusqu’à leur réalisation."

method:
  eyebrow: "Mon approche"
  title: "Une approche pragmatique, du besoin à la réalisation."
  steps:
    - icon: structuration
      title: "01 — Structurer"
      text: "Comprendre votre situation, clarifier les objectifs et identifier les contraintes et les acteurs concernés."
    - icon: priorisation
      title: "02 — Prioriser"
      text: "Explorer les options, définir les actions essentielles et construire un plan réaliste."
    - icon: coordination
      title: "03 — Concrétiser"
      text: "Mettre en œuvre les actions, coordonner les intervenants et assurer le suivi jusqu’à un résultat concret."
  note: "Chaque mission est différente. J’interviens aussi bien sur un projet complet que sur une étape précise ou un besoin opérationnel ponctuel, en collaboration avec vos équipes et partenaires."

examples:
  eyebrow: "Exemples de réalisations"
  title: "Quelques exemples de projets concrets."
  items:
    - title: "Développement d’un événement international dédié à l’innovation maritime"
      category: "Gestion de projet · Événementiel · Innovation"
      text: "Coordination de projets, développement de nouvelles initiatives, mobilisation d’acteurs industriels et universitaires, enrichissement du programme et transmission des activités."
      context: "Expérience menée sur plusieurs années dans le cadre de mon parcours salarié."
    - title: "Digitalisation du processus de recrutement"
      category: "Ressources humaines · Digitalisation · Organisation"
      text: "Analyse des besoins, déploiement d’un outil de gestion des candidatures, adaptation des pratiques internes et formation des utilisateurs."
      context: "Projet réalisé en trois mois dans le cadre de mon parcours salarié."
    - title: "Prospection commerciale et préparation d’élément de pilotage"
      category: "Développement commercial · Coordination opérationnelle"
      text: "Étude d’opportunités commerciales dans le secteur du yachting, identification de prospects et d’interlocuteurs institutionnels, constitution de bases de contacts ciblées et création d’outils de suivi."
      context: "Mission réalisée dans le cadre de Mille Solutions."
  note: ""

about:
  eyebrow: "À propos"
  title: "Une expérience de terrain au service de vos projets."
  introTitle: "Qui suis-je ?"
  paragraphs:
    - "J’ai créé Mille Solutions pour mettre mon expérience en gestion de projets, coordination d’équipes et amélioration des organisations au service des entreprises et des professionnels."
    - "Mon parcours m’a amenée à évoluer dans des environnements très différents : opérations offshore, missions humanitaires, yachting, événementiel, ressources humaines, digitalisation et durabilité."
    - "Ce qui relie ces expériences : comprendre rapidement une situation, réunir les bonnes personnes, trouver des solutions pratiques et faire avancer les projets jusqu’à leur réalisation."
    - "Basée à Monaco, j’interviens auprès d’organisations aux besoins et aux moyens variés."
  # Phase 1 : ouvre le profil LinkedIn ; phase 2 : page « Approche et parcours ».
  cta: "Découvrir mon parcours"
  portraitCaption: "Portrait de Charlotte à fournir"

