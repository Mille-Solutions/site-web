meta:
  title: "Mille Solutions — Structure. Prioritize. Deliver. | Monaco"
  description: "I help small and medium-sized businesses and institutions in Monaco and the surrounding region clarify their needs, structure their projects and coordinate their delivery."

hero:
  title:
    - "Move your projects forward."
    - "Simplify the way you work."
  lead: "I support companies and organisations with project management, improving how they operate and implementing practical solutions."
  leadSecondary: "I also assist with one-off operational needs when you lack time, resources or simply an outside perspective to move forward."
  engagementLabel: "My commitment"
  signature: "Structure. Prioritize. Deliver."
  # Photo provisoire issue de la maquette Figma : origine et droits à valider avant publication.
  imageAlt: "View of Monaco: the city, Port Hercule and the sea in the morning light."

situations:
  eyebrow: "Your needs"
  title: "Do you need to move a subject forward?"
  items:
    - icon: coordination
      title: "A project that is struggling to move forward"
      text: ""
      paragraphs:
        - "Objectives may lack clarity, decisions may be delayed or stakeholders may struggle to coordinate."
        - "I help identify the blockers, organise the next steps and get the project moving again."
    - icon: structuration
      title: "An organisation that could operate more simply"
      text: ""
      paragraphs:
        - "Complex processes, unsuitable tools, repetitive tasks or unclear responsibilities complicate day-to-day work."
        - "I help identify useful improvements and put them in place."
    - icon: priorisation
      title: "A one-off need, but not the resources to address it"
      text: ""
      paragraphs:
        - "A study to conduct, an event to prepare, an opportunity to explore or an action to coordinate?"
        - "I can take responsibility for these assignments, from preparation through to delivery."

method:
  eyebrow: "My approach"
  title: "A practical approach, from need to delivery."
  steps:
    - icon: structuration
      title: "01 — Structure"
      text: "Understand your situation, clarify objectives and identify constraints and stakeholders."
    - icon: priorisation
      title: "02 — Prioritize"
      text: "Explore options, define essential actions and build a realistic plan."
    - icon: coordination
      title: "03 — Deliver"
      text: "Implement actions, coordinate stakeholders and monitor delivery through to a concrete result."
  note: "Every assignment is different. I can work on an entire project or a specific stage or one-off operational need, in collaboration with your teams and partners."

