  eyebrow: "Contact"
  title: "Parlons de votre projet."
  text: "Vous avez un projet à lancer, une organisation à améliorer ou un besoin ponctuel à traiter ?\n\nPrésentez-moi votre situation et vos besoins. Nous pourrons échanger sur la manière dont je peux vous accompagner."
  form:
    eyebrow: "Contactez-moi"
    intro: "Utilisez le formulaire de contact pour me présenter votre demande."
    cta: "Remplir le formulaire"
