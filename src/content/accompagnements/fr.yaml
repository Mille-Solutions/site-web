approach:
  eyebrow: "Une approche personnelle"
  title: "Structurer. Prioriser. Concrétiser."
  items:
    - icon: structuration
      title: "Structurer"
      text: "Je recherche des solutions proportionnées, utilisables par les équipes et durables dans leur fonctionnement. Selon le sujet, j’intègre les enjeux humains, environnementaux, de confidentialité et de gouvernance dans les choix proposés."
    - icon: priorisation
      title: "Prioriser"
      text: "Nous définissons ensemble le périmètre, les livrables et les modalités d’intervention avant de démarrer. Cela permet de clarifier les attentes, de hiérarchiser les actions et de préparer une mise en œuvre réaliste."
    - icon: coordination
      title: "Concrétiser"
      text: "J’accompagne le projet jusqu’à sa réalisation, en coordonnant les étapes et les personnes concernées. Tout au long de la mission, je prépare la transmission des connaissances, des outils et des méthodes pour que vos équipes puissent prendre le relais et poursuivre de manière autonome après notre collaboration."

cta:
