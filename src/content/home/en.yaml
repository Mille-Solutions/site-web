about:
  eyebrow: "About"
  title: "Hands-on experience in the service of your projects."
  introTitle: "Who am I?"
  paragraphs:
    - "I founded Mille Solutions to apply my experience in project management, team coordination and organisational improvement to the needs of companies and professionals."
